services:
  postgres17:
    image: postgres:17-alpine3.20
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    networks:
      - local_network
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2-3
    environment:
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 9080
      KC_HOSTNAME_STRICT_BACKCHANNEL: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: info
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9080/health/ready" ]
      interval: 15s
      timeout: 2s
      retries: 15
    command: [ "start-dev", "--http-port", "9080", "--https-port", "7443", "--import-realm" ]
    volumes: # Ignore if you don't have realm-export.json to migrate data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "9080:9080"
      - "7443:7443"
    expose:
      - "9080"
    networks:
      - local_network
networks:
  local_network:
    driver: bridge
